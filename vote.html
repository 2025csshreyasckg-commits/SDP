<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vote Validator</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            /* Background Image */
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.70)
                ),
                url("voting.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            background-attachment: fixed;

            transition: background-position 0.3s ease;
        }


        /* Main Card */

        .box {

            width: 430px;

            padding: 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5);

            animation: cardAppear 0.8s ease;

        }


        /* Card Animation */

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        /* Heading */

        h1 {

            color: white;

            font-size: 32px;

            margin-bottom: 10px;

        }


        .subtitle {

            color: #dddddd;

            font-size: 14px;

            margin-bottom: 30px;

        }


        /* Input Groups */

        .input-group {

            text-align: left;

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: white;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;

        }


        /* Input Fields */

        input {

            width: 100%;

            padding: 14px 16px;

            border: none;

            outline: none;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.92);

            font-size: 16px;

            transition: all 0.3s ease;

        }


        input:focus {

            transform: scale(1.02);

            box-shadow:
                0 0 0 3px rgba(255, 153, 51, 0.6);

        }


        input::placeholder {

            color: #777;

        }


        /* Buttons */

        button {

            width: 100%;

            padding: 15px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: #ff9933;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: all 0.3s ease;

        }


        button:hover {

            background: #ff8000;

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.3);

        }


        button:active {

            transform: scale(0.97);

        }


        /* Reset Button */

        .reset {

            background: rgba(255, 255, 255, 0.20);

        }


        .reset:hover {

            background: rgba(255, 255, 255, 0.30);

        }


        /* Result */

        #Answer {

            margin-top: 25px;

            padding: 16px;

            border-radius: 12px;

            color: white;

            font-weight: bold;

            line-height: 1.5;

            display: none;

        }


        /* Success */

        .success {

            display: block !important;

            background: rgba(0, 150, 80, 0.85);

            animation: resultAnimation 0.5s ease;

        }


        /* Error */

        .error {

            display: block !important;

            background: rgba(200, 40, 40, 0.85);

            animation: resultAnimation 0.5s ease;

        }


        /* Result Animation */

        @keyframes resultAnimation {

            from {

                opacity: 0;

                transform: scale(0.85);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* Footer */

        .footer {

            margin-top: 20px;

            color: #dddddd;

            font-size: 12px;

        }


        /* Mobile Responsive */

        @media (max-width: 500px) {

            .box {

                width: 90%;

                padding: 30px 25px;

            }

            h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="box">

        <h1>🗳️ Vote Validator</h1>

        <p class="subtitle">
            Check your eligibility to vote in India
        </p>


        <!-- Name -->

        <div class="input-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
            >

        </div>


        <!-- Age -->

        <div class="input-group">

            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                min="1"
                max="120"
            >

        </div>


        <!-- Nationality -->

        <div class="input-group">

            <label for="nationality">
                Nationality
            </label>

            <input
                type="text"
                id="nationality"
                placeholder="e.g. Indian"
            >

        </div>


        <!-- Submit -->

        <button onclick="vote()">
            ✓ Check Eligibility
        </button>


        <!-- Reset -->

        <button
            class="reset"
            onclick="resetForm()"
        >
            ↻ Reset
        </button>


        <!-- Result -->

        <p id="Answer"></p>


        <div class="footer">

            Voting eligibility requires:
            <br>

            Age 18+ • Indian Nationality

        </div>

    </div>


    <script src="vote.js"></script>

</body>

</html>
